<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efe8dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <meta name="description" content="A private menu. The links are encrypted." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paul's Home" />
    <title>Paul's Home</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23234237'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23f6fbf8'%3EP%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #efe8dc;
        --card: #fbf7f0;
        --ink: #221e19;
        --muted: #5c564c;
        --eyebrow: #6a5344;
        --line: #e0d6c6;
        --accent: #234237;
        --accent-ink: #f6fbf8;
        --accent-press: #1a332a;
        --row: #f3eee4;
        --note: #f3ecdf;
        --danger: #8f2d2d;
        --focus: #1d6b45;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #141311;
          --card: #1e1c19;
          --ink: #f6f1e8;
          --muted: #c2b8aa;
          --eyebrow: #d2bba4;
          --line: #34302a;
          --accent: #b7dcc8;
          --accent-ink: #14241c;
          --accent-press: #9fcbb4;
          --row: #2a2723;
          --note: #2a2621;
          --danger: #ffb4b4;
          --focus: #d7f3e4;
        }
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 1.0625rem;
        line-height: 1.45;
      }
      .wrap {
        width: min(40rem, 100%);
        margin: 0 auto;
        padding:
          max(1.25rem, env(safe-area-inset-top))
          max(1rem, env(safe-area-inset-right))
          max(2.75rem, env(safe-area-inset-bottom))
          max(1rem, env(safe-area-inset-left));
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin: 0 0 1rem;
        padding: 0.15rem 0 0.85rem;
        background: var(--bg);
      }
      .eyebrow {
        margin: 0 0 0.2rem;
        color: var(--eyebrow);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: ui-serif, Georgia, "Iowan Old Style", Palatino, serif;
        font-size: clamp(2rem, 1.4rem + 2vw, 2.6rem);
        font-weight: 560;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      h2 {
        margin: 1.35rem 0 0.45rem;
        color: var(--eyebrow);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        scroll-margin-top: 5.5rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
      }
      .gate { padding: 1.15rem 1.15rem 1.25rem; }
      .lede { margin: 0 0 1rem; }
      .field {
        display: block;
        font-size: 0.95rem;
        font-weight: 700;
      }
      input[type="password"] {
        display: block;
        width: 100%;
        margin: 0.4rem 0 0.85rem;
        min-height: 3.25rem;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 0.8rem;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 1.0625rem;
      }
      input[type="password"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      input[aria-invalid="true"] { border-color: var(--danger); }
      input:-webkit-autofill {
        -webkit-text-fill-color: var(--ink);
        caret-color: var(--ink);
        transition: background-color 9999s ease-out;
      }
      .remember {
        display: flex;
        align-items: flex-start;
        gap: 0.8rem;
        min-height: 3rem;
        margin: 0 0 1rem;
        padding: 0.35rem 0;
        cursor: pointer;
      }
      .remember input {
        width: 1.35rem;
        height: 1.35rem;
        margin: 0.15rem 0 0;
        flex: none;
        accent-color: var(--accent);
      }
      .remember-title { display: block; font-weight: 650; }
      .remember-help { display: block; margin-top: 0.15rem; color: var(--muted); font-size: 0.95rem; }
      .primary {
        width: 100%;
        min-height: 3.25rem;
        border: 0;
        border-radius: 0.8rem;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
      }
      .primary:active { background: var(--accent-press); }
      .primary:disabled { cursor: progress; opacity: 0.72; }
      .primary:focus-visible, .lock:focus-visible, .link:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .link:focus-visible { outline-offset: -3px; }
      .title { min-width: 0; flex: 1; }
      .lock {
        flex: none;
        min-height: 3rem;
        min-width: 5.25rem;
        padding: 0.45rem 0.95rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .lock:active { background: var(--row); }
      .status { min-height: 0; margin: 0 0 0.75rem; }
      .status:empty { display: none; }
      .status.error { color: var(--danger); font-weight: 700; }
      .note {
        margin: 0;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--line);
        background: var(--note);
        border-radius: 1rem 1rem 0 0;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      .link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 3.25rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
      }
      li:last-child .link { border-bottom: 0; }
      .card > ul:first-child li:first-child .link { border-radius: 1rem 1rem 0 0; }
      li:last-child .link { border-radius: 0 0 1rem 1rem; }
      .card > ul:first-child li:first-child:last-child .link { border-radius: 1rem; }
      .link:active { background: var(--row); }
      @media (hover: hover) {
        .link:hover { background: var(--row); }
      }
      .link-text { display: flex; flex-direction: column; gap: 0.12rem; min-width: 0; }
      .label { font-weight: 650; overflow-wrap: anywhere; }
      .hint { color: var(--muted); font-size: 0.92rem; }
      .chev {
        width: 0.55rem;
        height: 0.55rem;
        margin-left: auto;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(-45deg);
        flex: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [hidden] { display: none !important; }
      @media (forced-colors: active) {
        .primary, .lock, .card { border: 1px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="title">
          <p class="eyebrow">Private menu</p>
          <h1 id="home-title">Paul's Home</h1>
        </div>
        <button type="button" class="lock" id="lock" hidden>Lock</button>
      </header>
      <main>
        <p id="status" class="status" role="alert"></p>
        <section id="gate" class="card gate">
          <p class="lede">The menu is encrypted in this page. It stays blank until the password is right.</p>
          <form id="gate-form" method="post" action="">
            <label class="field" for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="go"
              required
            />
            <label class="remember">
              <input id="remember" name="remember" type="checkbox" />
              <span>
                <span class="remember-title">Remember on this device</span>
                <span class="remember-help">Stays unlocked on this device after the browser closes.</span>
              </span>
            </label>
            <button id="unlock" class="primary" type="submit">Unlock</button>
          </form>
        </section>
        <noscript><p class="status error">This page needs JavaScript to unlock.</p></noscript>
        <div id="app" hidden>
          <div id="menu"></div>
        </div>
      </main>
    </div>
    <!-- Built by home/build.mjs. Titles and URLs are ciphertext. -->
    <script id="vault" type="application/json">___VAULT_JSON___</script>
    <script src="unlock.js" type="module"></script>
  </body>
</html>
